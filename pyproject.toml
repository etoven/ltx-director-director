[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltx-prompt-director"
version = "1.8.4"
description = "LTX Director - Director: native timeline prompt builder for LTX Video 2.3"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LTX Director - Director contributors"}]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=10.4,<12",
  "requests>=2.32,<3",
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.5,<1",
]

[project.scripts]
ltx-director-director = "ltx_prompt_director.__main__:main"
ltx-director-director-install-desktop = "ltx_prompt_director.desktop:install_main"
ltx-director-director-uninstall-desktop = "ltx_prompt_director.desktop:uninstall_main"
# Compatibility aliases retained so existing installs and shortcuts keep working.
ltx-prompt-director = "ltx_prompt_director.__main__:main"
ltx-prompt-director-install-desktop = "ltx_prompt_director.desktop:install_main"
ltx-prompt-director-uninstall-desktop = "ltx_prompt_director.desktop:uninstall_main"

[tool.setuptools.packages.find]
include = ["ltx_prompt_director*"]

[tool.setuptools.package-data]
ltx_prompt_director = ["assets/*.png", "assets/*.svg"]

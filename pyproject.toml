[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltx-prompt-director"
version = "1.13.0a110"
description = "Prompt Director: native AI video prompt editor and completed-shot sequence workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Prompt Director contributors"}]
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "PySide6-Addons>=6.8,<7",
  "Pillow>=10.4,<12",
  "requests>=2.32,<3",
  "PyJWT[crypto]>=2.10,<3",
  "imageio-ffmpeg>=0.5,<1",
  "av>=14,<17",
  "numpy>=1.26,<3",
  "pyenchant>=3.2,<4",
]

[project.scripts]
prompt-director = "ltx_prompt_director.__main__:main"
prompt-director-install-desktop = "ltx_prompt_director.desktop:install_main"
prompt-director-uninstall-desktop = "ltx_prompt_director.desktop:uninstall_main"
ltx-director-director = "ltx_prompt_director.__main__:main"
ltx-director-director-install-desktop = "ltx_prompt_director.desktop:install_main"
ltx-director-director-uninstall-desktop = "ltx_prompt_director.desktop:uninstall_main"
# Compatibility aliases retained so existing installs and shortcuts keep working.
ltx-prompt-director = "ltx_prompt_director.__main__:main"
ltx-prompt-director-install-desktop = "ltx_prompt_director.desktop:install_main"
ltx-prompt-director-uninstall-desktop = "ltx_prompt_director.desktop:uninstall_main"

[tool.setuptools.packages.find]
include = ["ltx_prompt_director*"]

[tool.setuptools.package-data]
ltx_prompt_director = ["assets/*.png", "assets/*.svg", "assets/*.json", "assets/onboarding/*.png", "assets/onboarding/*.svg", "assets/onboarding/*.ttf", "assets/onboarding/*OFL.txt", "assets/help/*.html", "assets/help/*.css", "assets/help/*.js", "assets/help/images/*.png", "assets/effects/*", "assets/effects/thumbnails/*", "assets/effects/illustrations/*", "assets/effects/reference_clips/*", "assets/effects/audio_samples/*", "assets/effects/audio_samples/source/*", "assets/effects/sources/*", "assets/effects/prompts/*", "workspace_templates/*.json", "engine_templates/*.json"]

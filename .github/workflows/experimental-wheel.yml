name: Build and publish experimental wheel

on:
  push:
    branches: [experimental]
    paths:
      - "pyproject.toml"
      - "ltx_prompt_director/**"
      - "tests/**"
      - ".github/workflows/experimental-wheel.yml"

concurrency:
  group: experimental-wheel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental
        uses: actions/checkout@v4
        with:
          ref: experimental
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64 libdbus-1-3

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .

      - name: Test one-button slash refinement and Gemini/OpenAI image tool fallback
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_project_duplicate.py tests/test_chatgpt_oauth.py tests/test_live_generation.py tests/test_stream_json.py tests/test_live_inline_diff.py tests/test_segment_plan.py
          # Qt objects and native animation timers can outlive a test method.
          # Run every regression while keeping QApplication lifetimes bounded;
          # retain each test's real exit status (never ignore crashes/failures).
          python - <<'PY'
          import ast
          import subprocess
          import sys
          from pathlib import Path
          
          path = Path("tests/test_minimax_editor.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))
          tests = sorted(
              node.name for node in ast.walk(tree)
              if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")
          )
          # Per-test subprocesses prevent Qt native dialogs and timers from
          # surviving into an unrelated editor regression.
          for first in range(len(tests)):
              selections = [
                  f"tests/test_minimax_editor.py::UnifiedEditorTests::{tests[first]}"
              ]
              code = (
                  "import os,sys,pytest; "
                  f"rc=pytest.main({['-vv', *selections]!r}); "
                  "sys.stdout.flush(); sys.stderr.flush(); os._exit(rc)"
              )
              print(f"Qt regression {first + 1}/{len(tests)}: {tests[first]}", flush=True)
              result = subprocess.run(
                  [sys.executable, "-X", "faulthandler", "-c", code],
                  timeout=25,
              )
              if result.returncode:
                  raise SystemExit(result.returncode)
          print(f"All {len(tests)} Qt editor tests passed.", flush=True)
          PY

      - name: Build the wheel
        run: python -m build --wheel --outdir dist

      - name: Publish wheel to experimental
        run: |
          set -e
          VERSION=$(python -c 'from ltx_prompt_director import __version__; print(__version__)')
          WHEEL="dist/ltx_prompt_director-${VERSION}-py3-none-any.whl"
          test -s "$WHEEL"
          python -m zipfile -t "$WHEEL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$WHEEL"
          if ! git diff --cached --quiet; then
            git commit -m "Publish experimental wheel ${VERSION}"
            # A documentation or source change may land while CI runs.
            # Keep the built wheel commit and safely rebase before pushing.
            for attempt in 1 2 3; do
              git fetch origin experimental
              git rebase origin/experimental
              if git push origin HEAD:experimental; then
                exit 0
              fi
              echo "Experimental moved again; retrying publish (${attempt}/3)"
            done
            echo "Wheel was built but could not be pushed to experimental" >&2
            exit 1
          fi

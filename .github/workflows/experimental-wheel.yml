name: Build and publish experimental wheel

on:
  push:
    branches: [experimental]
    paths:
      - "pyproject.toml"
      - "ltx_prompt_director/**"
      - "tests/**"
      - ".github/workflows/experimental-wheel.yml"

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental
        uses: actions/checkout@v4
        with:
          ref: experimental
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64 libdbus-1-3

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install -e .

      - name: Test streaming, JSON presentation and prompt recovery
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_project_duplicate.py tests/test_chatgpt_oauth.py tests/test_live_generation.py tests/test_stream_json.py
          python -m pytest -q tests/test_minimax_editor.py

      - name: Build the wheel
        run: python -m build --wheel --outdir dist

      - name: Publish wheel to experimental
        run: |
          set -e
          VERSION=$(python -c 'from ltx_prompt_director import __version__; print(__version__)')
          WHEEL="dist/ltx_prompt_director-${VERSION}-py3-none-any.whl"
          test -s "$WHEEL"
          python -m zipfile -t "$WHEEL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$WHEEL"
          if ! git diff --cached --quiet; then
            git commit -m "Publish experimental wheel ${VERSION}"
            git push origin HEAD:experimental
          fi
